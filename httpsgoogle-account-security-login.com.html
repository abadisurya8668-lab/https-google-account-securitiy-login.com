<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Akun Google</title>
    <style>
        /* RESET & BASE STYLES */
        * {
            box-sizing: border-box;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
        }

        body {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #202124;
        }

        /* CONTAINER */
        .login-box {
            width: 450px;
            min-height: 500px;
            padding: 48px 40px 36px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            text-align: center;
        }

        @media (max-width: 450px) {
            .login-box {
                width: 100%;
                border: none;
                padding: 24px;
            }
        }

        /* LOGO */
        .logo {
            height: 24px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            font-size: 24px;
            font-weight: 500;
        }

        /* TEXTS */
        h1 {
            font-size: 24px;
            font-weight: 400;
            margin: 0 0 8px;
        }

        p {
            font-size: 16px;
            margin-bottom: 40px;
        }

        .user-email-chip {
            display: inline-flex;
            align-items: center;
            padding: 5px 12px;
            border: 1px solid #dadce0;
            border-radius: 100px;
            font-size: 14px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        /* INPUT GROUP */
        .input-container {
            position: relative;
            margin-bottom: 10px;
            text-align: left;
        }

        .input-container input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }

        .input-container input:focus {
            border: 2px solid #1a73e8;
            padding: 12px 14px;
        }

        .input-container label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #5f6368;
            background: white;
            padding: 0 4px;
            pointer-events: none;
            transition: 0.2s ease all;
        }

        /* Label float effect */
        .input-container input:focus ~ label,
        .input-container input:valid ~ label {
            top: 0;
            font-size: 12px;
            color: #1a73e8;
        }

        /* BUTTONS */
        .blue-link {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            display: inline-block;
            margin-top: 8px;
        }

        .footer-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
        }

        .btn-next {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-next:hover {
            background-color: #1765cc;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        .info-text {
            font-size: 14px;
            color: #5f6368;
            text-align: left;
            margin-top: 30px;
            line-height: 1.4;
        }

        /* UTILS */
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <!-- Logo -->
        <div class="logo">
            <span style="color: #4285F4;">G</span>
            <span style="color: #EA4335;">o</span>
            <span style="color: #FBBC05;">o</span>
            <span style="color: #4285F4;">g</span>
            <span style="color: #34A853;">l</span>
            <span style="color: #EA4335;">e</span>
        </div>

        <!-- STEP 1: EMAIL -->
        <div id="step-email">
            <h1>Login</h1>
            <p>Lanjutkan ke Google</p>

            <div class="input-container">
                <input type="email" id="email" required autocomplete="off">
                <label for="email">Email atau ponsel</label>
            </div>

            <div style="text-align: left;">
                <a href="#" class="blue-link">Lupa email?</a>
            </div>

            <div class="info-text">
                Bukan komputer Anda? Gunakan mode Tamu untuk login secara pribadi. 
                <a href="#" class="blue-link" style="margin: 0;">Pelajari lebih lanjut</a>
            </div>
        </div>

        <!-- STEP 2: PASSWORD -->
        <div id="step-password" class="hidden">
            <h1>Selamat datang</h1>
            <div class="user-email-chip" id="chip-email">
                <!-- Email akan muncul di sini -->
            </div>

            <div class="input-container">
                <input type="password" id="password" required>
                <label for="password">Masukkan sandi Anda</label>
            </div>

            <div style="text-align: left;">
                <a href="#" class="blue-link">Lupa sandi?</a>
            </div>
        </div>

        <!-- ACTIONS -->
        <div class="footer-action">
            <a href="#" class="blue-link" id="create-acc">Buat akun</a>
            <button type="button" class="btn-next" id="btn-next">Berikutnya</button>
        </div>
    </div>

    <script>
        const btnNext = document.getElementById('btn-next');
        const stepEmail = document.getElementById('step-email');
        const stepPassword = document.getElementById('step-password');
        const emailInput = document.getElementById('email');
        const chipEmail = document.getElementById('chip-email');
        const createAcc = document.getElementById('create-acc');

        let currentStep = 1;

        btnNext.addEventListener('click', () => {
            if (currentStep === 1) {
                if (emailInput.value.length > 5 && emailInput.value.includes('@')) {
                    // Berpindah ke Password
                    stepEmail.classList.add('hidden');
                    stepPassword.classList.remove('hidden');
                    chipEmail.innerText = emailInput.value;
                    createAcc.classList.add('hidden'); // Google biasanya sembunyikan "buat akun" di halaman pass
                    btnNext.innerText = 'Login';
                    currentStep = 2;
                } else {
                    alert('Masukkan email yang valid');
                }
            } else {
                // Proses Login
                alert('Mencoba masuk dengan akun: ' + emailInput.value);
            }
        });

        // Klik chip email untuk kembali ke form email
        chipEmail.addEventListener('click', () => {
            stepPassword.classList.add('hidden');
            stepEmail.classList.remove('hidden');
            createAcc.classList.remove('hidden');
            btnNext.innerText = 'Berikutnya';
            currentStep = 1;
        });
    </script>
</body>
</html>
